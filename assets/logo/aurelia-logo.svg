<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <style>
    .brand-text { font-family: 'Playfair Display', Georgia, serif; font-size: 38px; fill: #1C1B1A; font-weight: 600; letter-spacing: 0.12em; }
    .tagline-text { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; fill: #8F8A82; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase; }
    .mark { fill: none; stroke: #A86445; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
